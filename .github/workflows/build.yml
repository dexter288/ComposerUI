name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Package tests
        run: swift test
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Build app
        run: xcodebuild -project ComposerUI.xcodeproj -scheme ComposerUI -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_ALLOWED=NO build
